<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
</head>
<body>
    <div class="container">
        <h1>Получить UIN</h1>
        <div class="input-section">
            <label for="min">Минимум:</label>
            <input type="number" id="min" value="1" min="1">
            <label for="max">Максимум:</label>
            <input type="number" id="max" value="100" min="min">
        </div>
        <button id="generate">Сгенерировать!</button>
        <div class="result">
            <p id="randomNumber">Нажмите кнопку для генерации</p>
        </div>
    </div>

    <script>
        // Функция для генерации случайного числа в диапазоне [min, max]
        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // Привязываем событие клика к кнопке
        document.getElementById('generate').addEventListener('click', function() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);

            // Проверяем, чтобы минимум не был больше максимума
            if (min > max) {
                alert('Минимум не может быть больше максимума!');
                return;
            }

            // Генерируем число и обновляем содержимое блока с результатом
            const randomNumber = getRandomNumber(min, max);
            document.getElementById('randomNumber').textContent = randomNumber;
        });
    </script>
</body>
</html>
